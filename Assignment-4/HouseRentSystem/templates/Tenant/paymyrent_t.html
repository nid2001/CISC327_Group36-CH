<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Rent System</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 200px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding-top: 20px;
        }
        .sidebar button {
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            border: none;
            background-color: #d3d3d3;
            border-radius: 4px;
            cursor: pointer;
        }
        .sidebar button:hover {
            background-color: #bbb;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <button onclick="navigateTo('mychat_t')">My Chat</button>
        <button onclick="navigateTo('paymyrent_t')">Pay My Rent</button>
        <button onclick="navigateTo('maintenance_t')">Maintenance</button>
        <button onclick="navigateTo('rentnow_t')">Rent Now!</button>
        <button onclick="navigateTo('myaccount')">My Account</button>
    </div>
    <div class="content">
        <h2>This feature is coming.</h2>
        <p>Click on the options on the left to access different features.</p>
    </div>

    <script>
        const phone = "{{ phone }}";  // Get the phone number dynamically

        function navigateTo(page) {
            window.location.href = `/${phone}/${page}`;
        }
    </script>
</body>
</html>
