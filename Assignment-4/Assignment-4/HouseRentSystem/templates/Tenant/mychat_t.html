<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Rent System</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 200px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding-top: 20px;
        }
        .sidebar button {
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            border: none;
            background-color: #d3d3d3;
            border-radius: 4px;
            cursor: pointer;
        }
        .sidebar button:hover {
            background-color: #bbb;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <button onclick="navigateTo('mychat_t')">My Chat</button>
        <button onclick="navigateTo('paymyrent_t')">Pay My Rent</button>
        <button onclick="navigateTo('maintenance_t')">Maintenance</button>
        <button onclick="navigateTo('rentnow_t')">Rent Now!</button>
        <button onclick="navigateTo('myaccount')">My Account</button>
    </div>
    <div class="content">
        <h2>Messages</h2>
         <!-- Display unique chat buttons for each tenant and property -->
        {% if active_chats %}
            <div class="list-group mt-4">
                {% for chat in active_chats %}
                    <a href="{{ url_for('mychat_detail_t', property_id=chat.property_id, landlord_phone=chat.landlord_phone) }}" class="btn btn-primary mb-2">
                        Chat with {{ chat.landlord_phone }} (Property ID: {{ chat.property_id }})
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <p>No active chats available.</p>
        {% endif %}



    </div>

    <script>
        const phone = "{{ phone }}";  // Get the phone number dynamically

        function navigateTo(page) {
            window.location.href = `/${phone}/${page}`;
        }
    </script>
</body>
</html>
