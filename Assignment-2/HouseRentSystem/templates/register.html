<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            margin-bottom: 15px;
            width: 200px;
        }
        .user-type {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-type label {
            margin-right: 10px;
        }
        .radio-group {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
        }
        button {
            align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <form method="POST" action="{{ url_for('register') }}">
            <label for="phone">Phone:</label>
            <input type="text" name="phone" required>
            <label for="username">Username:</label>
            <input type="text" name="username" required>
            <label for="email">Email:</label>
            <input type="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" name="password" required>
            <div class="user-type">
                <label>Register as:</label>
                <div class="radio-group">
                    <input type="radio" name="user_type" value="landlord" required> Landlord
                </div>
                <div class="radio-group">
                    <input type="radio" name="user_type" value="tenant" required> Tenant
                </div>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
